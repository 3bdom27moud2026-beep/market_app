name: Flutter CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Select Flavor to Build'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'dev'
          - 'prod'
      build_type:
        description: 'Select Output Type'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'
          - 'apk'
          - 'appbundle'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Quality Assurance & Code Analysis
  # ───────────────────────────────────────────────────────────────────────────
  quality_check:
    name: Code Analysis & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle & Maven artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze lib/

      - name: Run Unit & Widget Tests
        run: flutter test --no-pub || true

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Build & Distribute Development Flavor (APK)
  # ───────────────────────────────────────────────────────────────────────────
  build_dev:
    name: Build Dev Flavor (APK)
    needs: quality_check
    if: |
      always() &&
      (needs.quality_check.result == 'success') &&
      (github.event_name != 'workflow_dispatch' || inputs.flavor == 'dev' || inputs.flavor == 'both')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle & Maven artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Development APK
        run: flutter build apk --flavor dev -t lib/main_dev.dart --release

      - name: Upload Dev APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShopGuide-Dev-Release-APK
          path: build/app/outputs/flutter-apk/*dev*.apk
          retention-days: 14

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute Dev APK via Firebase App Distribution
        run: |
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-dev-release.apk \
            --app ${{ secrets.FIREBASE_APP_ID_DEV }} \
            --groups "testGroup" \
            --release-notes "Dev build from branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}" \
            --token ${{ secrets.FIREBASE_TOKEN }}

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Build & Distribute Production Flavor (APK & AAB)
  # ───────────────────────────────────────────────────────────────────────────
  build_prod:
    name: Build Prod Flavor (APK & AAB)
    needs: quality_check
    if: |
      always() &&
      (needs.quality_check.result == 'success') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && (inputs.flavor == 'prod' || inputs.flavor == 'both')))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle & Maven artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Production APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'apk' || inputs.build_type == 'both'
        run: flutter build apk --flavor prod -t lib/main_prod.dart --release

      - name: Upload Prod APK Artifact
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'apk' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: ShopGuide-Prod-Release-APK
          path: build/app/outputs/flutter-apk/*prod*.apk
          retention-days: 30

      - name: Install Firebase CLI
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'apk' || inputs.build_type == 'both'
        run: npm install -g firebase-tools

      - name: Distribute Prod APK via Firebase App Distribution
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'apk' || inputs.build_type == 'both'
        run: |
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-prod-release.apk \
            --app ${{ secrets.FIREBASE_APP_ID_PROD }} \
            --groups "testGroup" \
            --release-notes "Prod build from branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}" \
            --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Build Production App Bundle (AAB)
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'appbundle' || inputs.build_type == 'both'
        run: flutter build appbundle --flavor prod -t lib/main_prod.dart --release

      - name: Upload Prod AAB Artifact
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'appbundle' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: ShopGuide-Prod-Release-AAB
          path: build/app/outputs/bundle/prodRelease/*.aab
          retention-days: 30
