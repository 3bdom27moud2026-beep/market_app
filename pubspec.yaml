name: market
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  shared_preferences: ^2.3.5
  flutter_native_splash: ^2.4.8
  dio: ^5.10.0
  equatable: ^2.1.0
  cached_network_image: ^3.4.1
  dartz: ^0.10.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  animate_do: ^4.0.0
  get_it: ^8.0.3
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.17
  image_picker: ^1.1.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  flutter_screenutil: ^5.9.3
  curved_navigation_bar: ^1.0.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-VariableFont_wght.ttf
